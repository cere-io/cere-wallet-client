name: Release to prod
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    uses: Cerebellum-Network/reusable-workflows/.github/workflows/deploy-to-cloudflare-pages.yaml@master
    with:
      project_name: 'cere-wallet-prod'
      runs-on: '["self-hosted", "cere-io-large"]'
      build_container: 'node:18-buster'
      install_packages_command: 'cp .env.prod .env; npm ci'
      build_command: 'npm run build'
      path_to_static_files_to_upload: 'build'
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN_READ }}
